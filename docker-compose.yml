services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resolver
      POSTGRES_PASSWORD: resolver
      POSTGRES_DB: resolverai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolver -d resolverai"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:        
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
